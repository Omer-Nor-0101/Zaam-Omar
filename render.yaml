services:
  - type: web
    name: forever-us
    runtime: node
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && node index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: JWT_SECRET
        generateValue: true
      - key: RESET_CODE
        generateValue: true
      - key: MAX_USERS
        value: 2
      - key: DATABASE_URL
        sync: false
